---
- name: Create users and assign groups
  hosts: all
  become: yes

  vars:
    users:
      - name: frank
        group: developer
      - name: harry
        group: manager
      - name: bob
        group: developer

  tasks:
    - name: Ensure groups exist
      group:
        name: "{{ item.group }}"
        state: present
      loop: "{{ users }}"
      loop_control:
        label: "{{ item.group }}"

    - name: Create users and assign to groups
      user:
        name: "{{ item.name }}"
        group: "{{ item.group }}"
        state: present
        create_home: yes
      loop: "{{ users }}"

